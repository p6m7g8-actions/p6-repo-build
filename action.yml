name: "P6 GHA: Build"
description: "P6 GHA: Build"
author: "Philip M. Gollucci"

inputs:
  gh_token:
    description: "GitHub Token"
    required: true
  actionlint:
    description: "Run actionlint (true/false)"
    required: false
    default: "true"
  cspell:
    description: "Run cspell (true/false)"
    required: false
    default: "true"
  markdownlint:
    description: "Run markdownlint (true/false)"
    required: false
    default: "true"
  secrets:
    description: "Run secrets check (true/false)"
    required: false
    default: "true"
  # Mirrors the default of secrets@main verbatim on purpose. This value is
  # always forwarded, so an empty default here would override the
  # sub-action's default and silently un-skip the lock files.
  secrets_exclude_files:
    description: "Regex of paths to skip. Lock files are skipped by default: their hashes are high entropy."
    required: false
    default: |-
      (^|/)(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|uv\.lock|poetry\.lock|Gemfile\.lock|Cargo\.lock|go\.sum)$
  shellcheck:
    description: "Run shellcheck (true/false)"
    required: false
    default: "true"
  shellcheck_ignore_paths:
    description: "Space-separated paths/globs to skip in shellcheck"
    required: false
    default: ""
  yamllint:
    description: "Run yamllint (true/false)"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    # Must come first. Every check below reads the workspace, and the
    # sub-actions that check out for themselves do so partway down the
    # chain, which left the earlier steps looking at an empty directory.
    - name: Checkout code
      uses: p6m7g8-actions/checkout@main

    - name: Secrets Check
      uses: p6m7g8-actions/secrets@main
      with:
        secrets: ${{ inputs.secrets }}
        exclude_files: ${{ inputs.secrets_exclude_files }}

    - name: GitHub Workflow Lint
      uses: p6m7g8-actions/p6-gh-action-linter@main
      with:
        actionlint: ${{ inputs.actionlint }}
        gh_token: ${{ inputs.gh_token }}

    - name: Markdown Lint
      uses: p6m7g8-actions/p6-gh-markdown-linter@main
      with:
        markdownlint: ${{ inputs.markdownlint }}

    - name: YAML Lint
      uses: p6m7g8-actions/yamllint@main
      with:
        yamllint: ${{ inputs.yamllint }}

    - name: ShellCheck
      uses: p6m7g8-actions/shellcheck@main
      with:
        shellcheck: ${{ inputs.shellcheck }}
        ignore_paths: ${{ inputs.shellcheck_ignore_paths }}

    - name: Cspell
      uses: p6m7g8-actions/cspell@main
      with:
        cspell: ${{ inputs.cspell }}
